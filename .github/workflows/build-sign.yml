name: build-scan-sign

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default; the job below asks for exactly what it needs.
permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write   # push to GHCR
      id-token: write   # OIDC token for keyless cosign signing
    strategy:
      fail-fast: true   # one image failing its scan stops the other too
      matrix:
        component: [fpm, nginx]
    env:
      IMAGE: ghcr.io/monospaced-dev/booking-engine-${{ matrix.component }}
    steps:
      # Every action is pinned to a full commit SHA (tag in the comment).
      # Tags are mutable: trivy-action's tags were force-pushed with malicious
      # code in March 2026 (GHSA-69fq-xp46-6x23). A SHA can't be rewritten.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # 1. Build into the runner's local Docker only; nothing is published yet.
      - name: Build (local, for scanning)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.component }}
          platforms: linux/arm64
          pull: true
          load: true
          tags: scan:${{ matrix.component }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      # 2. Gate: fail on fixable HIGH/CRITICAL vulns before anything ships.
      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: scan:${{ matrix.component }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

      # PRs stop here: built and scanned, never pushed or signed.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. Push the same layers (cache hit, no rebuild) under the real tags.
      - name: Push
        if: github.event_name != 'pull_request'
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.component }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request'
        with:
          cosign-release: v3.1.3

      # 4. Keyless signature: cosign swaps this job's OIDC token for a
      # short-lived cert naming this repo + workflow, and logs it in
      # Sigstore's Rekor. Sign the digest, never a tag.
      - name: Sign
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Summary
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: echo "- \`${IMAGE}@${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
