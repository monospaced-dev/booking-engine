openapi: 3.0.3
info:
  title: Booking Engine API
  version: 1.0.0
  description: |
    Busy-time storage and merging, not an availability or booking-policy engine.
    All response timestamps use UTC seconds precision: YYYY-MM-DDTHH:mm:ss+00:00.
    Intervals are half-open [start, end). Datetime inputs require an explicit
    offset (Z or +/-HH:mm). Blackout dates and times are resource-local values.
    This contract covers the service API; the unused Laravel /api/user scaffold
    and the web /up health route are outside this service contract.
servers:
  - url: /api
security:
  - ApiKey: []
paths:
  /health:
    get:
      operationId: health
      summary: Check database connectivity
      security: []
      responses:
        '200':
          description: Database reachable
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status: {type: string, enum: [ok]}
        '503':
          description: Database unreachable
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, database, message, code]
                properties:
                  status: {type: string, enum: [error]}
                  database: {type: string, enum: [unreachable]}
                  message: {type: string}
                  code: {type: string, enum: [database_unavailable]}
  /ping:
    get:
      operationId: ping
      summary: Liveness probe
      security: []
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
  /resources:
    post:
      operationId: findOrCreateResource
      summary: Find or create an external resource
      description: |
        Existing resources retain their stored timezone even if a different
        timezone is supplied. Use PUT to change it. The created flag is retained.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [external_type, external_id, timezone]
              properties:
                external_type: {type: string}
                external_id: {type: integer}
                timezone: {type: string, example: America/Chicago}
      responses:
        '201':
          description: Resource created (created=true)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResourceResult'}
        '200':
          description: Existing resource (created=false)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResourceResult'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Error'}
  /resources/{resource}:
    parameters:
      - {$ref: '#/components/parameters/ResourceId'}
    put:
      operationId: updateResource
      summary: Change resource timezone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [timezone]
              properties:
                timezone: {type: string, example: America/Chicago}
      responses:
        '200':
          description: Updated resource
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Resource'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Error'}
  /resources/{resource}/bookings:
    parameters:
      - {$ref: '#/components/parameters/ResourceId'}
    get:
      operationId: listBookings
      summary: List this resource's bookings
      description: |
        No pagination or ordering guarantee. With both from and to, returns
        bookings overlapping the half-open window; ranges are not clipped.
        The two bounds must be supplied together, with to later than from.
      parameters:
        - name: from
          in: query
          schema: {$ref: '#/components/schemas/DatetimeInput'}
        - name: to
          in: query
          schema: {$ref: '#/components/schemas/DatetimeInput'}
      responses:
        '200':
          description: Bookings, or an empty array
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Booking'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createBooking
      summary: Create a booking
      description: |
        Rejects overlap with other bookings, but does not enforce blackouts.
        An existing Idempotency-Key for this resource returns the stored booking
        with 200 only when UTC-normalised starts_at, ends_at and retained metadata match.
        Datetimes compare at the existing stored second precision. Omitted metadata
        and empty {} or [] compare equally. Metadata key order is ignored; values compare strictly. A mismatch returns 422 idempotency_mismatch.
        Keys are scoped to the resource. PATCH leaves the stored key untouched;
        retrying the original POST after a reschedule returns 422 idempotency_mismatch.
        Concurrent retries recover both exclusion and unique constraint races by
        re-selecting the resource-scoped key and applying the same comparison.
        An exclusion failure without a stored row for this key remains 409 booking_conflict.
        Supplied keys must contain 1–128 ASCII letters, digits, underscores or hyphens.
        Invalid keys return 422 with validation_failed.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_-]{1,128}$'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [starts_at, ends_at]
              properties:
                starts_at: {$ref: '#/components/schemas/DatetimeInput'}
                ends_at: {$ref: '#/components/schemas/DatetimeInput'}
                metadata:
                  description: Empty [] is also accepted as omitted metadata.
                  anyOf:
                    - {$ref: '#/components/schemas/Metadata'}
                    - type: array
                      maxItems: 0
                      items: {}
      responses:
        '201':
          description: Full stored booking
          headers:
            ETag: {$ref: '#/components/headers/BookingETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Booking'}
        '200':
          description: Full stored booking on idempotency replay
          headers:
            ETag: {$ref: '#/components/headers/BookingETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Booking'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Overlapping booking
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [message, code, error]
                properties:
                  message: {type: string}
                  code: {type: string, enum: [booking_conflict]}
                  error: {type: string, description: Retained legacy alias of message}
        '422':
          description: Invalid input or key (validation_failed), or key reuse with a different payload (idempotency_mismatch)
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [message, code, errors]
                    properties:
                      message: {type: string}
                      code: {type: string, enum: [validation_failed]}
                      errors:
                        type: object
                        additionalProperties:
                          type: array
                          items: {type: string}
                  - type: object
                    additionalProperties: false
                    required: [message, code]
                    properties:
                      message: {type: string}
                      code: {type: string, enum: [idempotency_mismatch]}
        default: {$ref: '#/components/responses/Error'}
  /resources/{resource}/bookings/{booking}:
    parameters:
      - {$ref: '#/components/parameters/ResourceId'}
      - name: booking
        in: path
        required: true
        description: Path IDs must match [0-9]{1,18}; invalid IDs return 404 route_not_found.
        schema: {type: string, pattern: '^[0-9]{1,18}$'}
    get:
      operationId: getBooking
      summary: Get a full booking belonging to this resource
      responses:
        '200':
          description: Full stored booking
          headers:
            ETag: {$ref: '#/components/headers/BookingETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Booking'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      operationId: rescheduleBooking
      summary: Atomically reschedule a booking
      description: |
        Changes only starts_at and ends_at, at stored UTC-second precision.
        Requires one strong quoted lock_version via If-Match. Weak tags, wildcards,
        lists and malformed tags fail with 412. Missing If-Match returns 428.
        The version comparison and increment occur in the same UPDATE as the times.
        Stale versions return 412 before overlap checking; failed requests retain
        the previous range and version. Every success, including a no-op, increments
        lock_version. Self-overlap and adjacency are allowed. Other bookings cause
        409; blackouts are not enforced. Metadata and resource changes are ignored.
        Idempotency-Key is ignored and the stored key is left untouched. A subsequent
        POST retry with the original key and original times returns 422
        idempotency_mismatch after the times have changed.
      parameters:
        - name: If-Match
          in: header
          required: true
          description: One strong quoted lock_version from the latest booking ETag.
          schema: {type: string, pattern: '^"[1-9][0-9]{0,9}"$', example: '"1"'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [starts_at, ends_at]
              properties:
                starts_at: {$ref: '#/components/schemas/DatetimeInput'}
                ends_at:
                  allOf:
                    - {$ref: '#/components/schemas/DatetimeInput'}
                  description: Must be later than starts_at.
      responses:
        '200':
          description: Full rescheduled booking
          headers:
            ETag: {$ref: '#/components/headers/BookingETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Booking'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Overlapping booking; previous range and version retained
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [message, code, error]
                properties:
                  message: {type: string}
                  code: {type: string, enum: [booking_conflict]}
                  error: {type: string}
        '412':
          description: If-Match does not match the current version
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [message, code]
                properties:
                  message: {type: string}
                  code: {type: string, enum: [precondition_failed]}
        '428':
          description: If-Match header required
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [message, code]
                properties:
                  message: {type: string}
                  code: {type: string, enum: [precondition_required]}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteBooking
      summary: Delete a booking belonging to this resource
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Error'}
  /resources/{resource}/busy:
    parameters:
      - {$ref: '#/components/parameters/ResourceId'}
    get:
      operationId: listBusyRanges
      summary: Merge and clip booking and blackout ranges to the query window
      parameters:
        - name: from
          in: query
          required: true
          schema: {$ref: '#/components/schemas/DatetimeInput'}
        - name: to
          in: query
          required: true
          description: Must be later than from.
          schema: {$ref: '#/components/schemas/DatetimeInput'}
      responses:
        '200':
          description: Merged UTC busy ranges, or an empty array
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [starts_at, ends_at]
                  properties:
                    starts_at: {$ref: '#/components/schemas/UtcTimestamp'}
                    ends_at: {$ref: '#/components/schemas/UtcTimestamp'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Error'}
  /resources/{resource}/blackout-dates:
    parameters:
      - {$ref: '#/components/parameters/ResourceId'}
    get:
      operationId: listBlackoutDates
      summary: List resource-local blackout dates in ascending date order
      responses:
        '200':
          description: Complete blackout objects, or an empty array
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/BlackoutDate'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createBlackoutDate
      summary: Create a resource-local full-day or partial-day blackout
      description: |
        Omit both times (or send null) for a full day. Otherwise supply both,
        with end_time later than start_time; overnight ranges are not accepted.
        Responses always contain both times in HH:MM:SS or null, and note or null.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date]
              properties:
                date:
                  type: string
                  description: A Laravel-valid date; YYYY-MM-DD is recommended.
                  example: '2026-07-21'
                start_time: {$ref: '#/components/schemas/LocalTimeInput'}
                end_time: {$ref: '#/components/schemas/LocalTimeInput'}
                note: {type: string, nullable: true}
      responses:
        '201':
          description: Full stored blackout object
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BlackoutDate'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Error'}
  /resources/{resource}/blackout-dates/{blackoutDate}:
    parameters:
      - {$ref: '#/components/parameters/ResourceId'}
      - name: blackoutDate
        in: path
        required: true
        schema: {type: string, pattern: '^[0-9]{1,18}$'}
    delete:
      operationId: deleteBlackoutDate
      summary: Delete a blackout belonging to this resource
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Error'}
components:
  headers:
    BookingETag:
      required: true
      description: Strong quoted lock_version, matching the booking body.
      schema: {type: string, pattern: '^"[1-9][0-9]*"$', example: '"1"'}
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    ResourceId:
      name: resource
      in: path
      required: true
      schema: {type: string, pattern: '^[0-9]{1,18}$'}
  responses:
    NoContent:
      description: Success with an empty response body
    Unauthorized:
      description: Missing, invalid or inactive API key
      content:
        application/json:
          schema:
            type: object
            required: [message, code]
            properties:
              message: {type: string}
              code: {type: string, enum: [unauthorized]}
    NotFound:
      description: Resource or child not found, including child ownership mismatch
      content:
        application/json:
          schema:
            type: object
            required: [message, code]
            properties:
              message: {type: string}
              code: {type: string, enum: [not_found, route_not_found]}
    ValidationFailed:
      description: Request validation failed
      content:
        application/json:
          schema:
            type: object
            required: [message, code, errors]
            properties:
              message: {type: string}
              code: {type: string, enum: [validation_failed]}
              errors:
                type: object
                additionalProperties:
                  type: array
                  items: {type: string}
    Error:
      description: |
        Other errors always include message and code. Unknown API routes return
        404 with route_not_found. Framework codes include forbidden (403),
        method_not_allowed (405), too_many_requests (429), internal_error (5xx),
        and request_failed for other statuses. Extra framework fields may remain.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    Error:
      type: object
      required: [message, code]
      properties:
        message: {type: string}
        code: {type: string, minLength: 1, pattern: '^[a-z][a-z0-9_]*$'}
    DatetimeInput:
      type: string
      description: A Laravel-valid datetime with an explicit Z or +/-HH:mm offset.
      pattern: '(Z|[+-][0-9]{2}:[0-9]{2})$'
      example: '2026-07-21T09:00:00-05:00'
    UtcTimestamp:
      type: string
      format: date-time
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\+00:00$'
      example: '2026-07-21T14:00:00+00:00'
    LocalTimeInput:
      type: string
      nullable: true
      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
      example: '12:00'
    LocalTime:
      type: string
      nullable: true
      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$'
      example: '12:00:00'
    Resource:
      type: object
      additionalProperties: false
      required: [id, external_type, external_id, timezone]
      properties:
        id: {type: integer}
        external_type: {type: string}
        external_id: {type: integer}
        timezone: {type: string}
    ResourceResult:
      type: object
      additionalProperties: false
      required: [id, external_type, external_id, timezone, created]
      properties:
        id: {type: integer}
        external_type: {type: string}
        external_id: {type: integer}
        timezone: {type: string}
        created: {type: boolean}
    Metadata:
      type: object
      maxProperties: 20
      description: >
        Opaque client reference data, stored and returned unchanged, never interpreted,
        indexed or logged by the engine. Do not use for personal information.
        Keys must match ^[A-Za-z0-9_]{1,40}$. Values are strings of at most 500
        characters or integers; no nested objects, lists, booleans, floats or nulls.
        Empty metadata is always serialized as {}. Key order has no meaning;
        idempotency compares values strictly (integer 7 differs from string "7").
      properties:
        appointment_id: {type: integer}
      additionalProperties:
        anyOf:
          - {type: string, maxLength: 500}
          - {type: integer}
    Booking:
      type: object
      additionalProperties: false
      required: [id, resource_id, external_type, external_id, metadata, idempotency_key, starts_at, ends_at, created_at, updated_at, lock_version]
      properties:
        id: {type: integer}
        resource_id: {type: integer}
        external_type: {type: string}
        external_id: {type: integer}
        metadata:
          $ref: '#/components/schemas/Metadata'
        lock_version: {type: integer, minimum: 1}
        idempotency_key: {type: string, nullable: true}
        starts_at: {$ref: '#/components/schemas/UtcTimestamp'}
        ends_at: {$ref: '#/components/schemas/UtcTimestamp'}
        created_at: {$ref: '#/components/schemas/UtcTimestamp'}
        updated_at: {$ref: '#/components/schemas/UtcTimestamp'}
    BlackoutDate:
      type: object
      additionalProperties: false
      required: [id, resource_id, date, start_time, end_time, note, created_at, updated_at]
      properties:
        id: {type: integer}
        resource_id: {type: integer}
        date: {type: string, format: date}
        start_time: {$ref: '#/components/schemas/LocalTime'}
        end_time: {$ref: '#/components/schemas/LocalTime'}
        note: {type: string, nullable: true}
        created_at: {$ref: '#/components/schemas/UtcTimestamp'}
        updated_at: {$ref: '#/components/schemas/UtcTimestamp'}
