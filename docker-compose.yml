services:
    postgres:
        image: postgres:16
        environment:
            POSTGRES_DB: booking_engine
            POSTGRES_USER: booking_engine
            POSTGRES_PASSWORD: local_dev_only
        ports:
            - "5433:5432" # 5433 on host to avoid clashing with any local Postgres you already run
        volumes:
            - booking_engine_pg_data:/var/lib/postgresql/data

    fpm:
        build:
            context: .
            dockerfile: docker/Dockerfile.fpm
        environment:
            DB_CONNECTION: pgsql
            DB_HOST: postgres
            DB_PORT: 5432
            DB_DATABASE: booking_engine
            DB_USERNAME: booking_engine
            DB_PASSWORD: local_dev_only
            APP_ENV: local
            APP_DEBUG: "true"
            APP_KEY: "" # fill in after first run, see instructions below
        depends_on:
            - postgres

    nginx:
        build:
            context: .
            dockerfile: docker/Dockerfile.nginx
        ports:
            - "8080:8080"
        volumes:
            # Overrides the k8s-oriented (127.0.0.1) config baked into the image with
            # one that addresses the fpm container by its compose service name.
            - ./docker/nginx.local-compose.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - fpm

volumes:
    booking_engine_pg_data:
